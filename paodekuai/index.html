<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跑得快</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0f5132; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: rgba(0,0,0,.28); padding: 8px 12px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; flex: 0 0 auto;
  }
  header .title { font-weight: 600; }
  header .info { opacity: .85; }

  .table { flex: 1; min-height: 0; position: relative; padding: 8px 10px 0; overflow: hidden;
    display: flex; flex-direction: column; }

  .ai-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .ai {
    background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 14px;
    font-size: 14px; min-width: 160px; text-align: center;
  }
  .ai.active { background: rgba(255,255,255,.22); }
  .ai .name { font-weight: 600; font-size: 15px; }
  .ai .cnt { opacity: .85; font-size: 13px; margin-top: 2px; }

  .board {
    flex: 1; display: flex; justify-content: center; align-items: center; gap: 18px;
    min-height: 96px; margin: 4px 0; flex-wrap: wrap;
  }
  .slot { display: flex; gap: 2px; min-height: 60px; align-items: center; }
  .slot .mini {
    width: 30px; height: 42px; border-radius: 5px; background: #fff;
    color: #222; font-size: 12px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid #ddd;
  }
  .slot .mini.red { color: #c0392b; }
  .pass-tag { font-size: 12px; opacity: .75; }

  .play-tip {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.85);
    background: rgba(0,0,0,.72); color: #ffd166; font-size: 30px; font-weight: 700;
    padding: 14px 26px; border-radius: 16px; opacity: 0; pointer-events: none;
    transition: opacity .15s, transform .15s; z-index: 40; letter-spacing: 2px;
  }
  .play-tip.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .last-info {
    text-align: center; font-size: 12px; opacity: .75;
    height: 18px; margin-bottom: 4px;
  }

  .me-bar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 8px 0 6px; font-size: 14px;
  }
  .me-bar .av3 {
    width: 114px; height: 114px; border-radius: 50%; overflow: hidden;
    background: #2e7d5b; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 42px; border: 4px solid #ffb703; flex: 0 0 auto;
  }
  .me-bar .av3 img { width: 100%; height: 100%; object-fit: cover; }
  .me-bar .cnt3 { opacity: .9; font-size: 14px; }
  .me-bar .nm3 { font-size: 17px; font-weight: 600; }

  .my-cards {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center;
    gap: 3px 2px; padding: 6px 8px 2px; max-height: 38vh; overflow-y: auto;
    background: rgba(0,0,0,.18);
  }
  .card {
    width: 42px; height: 60px; border-radius: 6px; background: #fff; color: #222;
    border: 1px solid #cfd6d2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    transition: transform .1s, box-shadow .1s; user-select: none;
    position: relative;
  }
  .card .r { font-size: 17px; font-weight: 700; line-height: 1; }
  .card .s { font-size: 15px; line-height: 1.1; }
  .card.red .r, .card.red .s { color: #c0392b; }
  .card.sel { transform: translateY(-10px); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .card.joker .r { font-size: 12px; }
  .card.joker .s { font-size: 14px; }

  .bar {
    flex: 0 0 auto; display: flex; gap: 10px; padding: 8px 12px 12px;
    background: rgba(0,0,0,.28);
  }
  .btn {
    flex: 1; padding: 12px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;
    background: #f1f3f4; color: #333;
  }
  .btn.primary { background: #ffb703; color: #3a2a00; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { flex: 0 0 96px; background: rgba(255,255,255,.18); color: #fff; }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; padding: 20px;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #fff; color: #222; border-radius: 16px; padding: 22px;
    width: 100%; max-width: 320px; text-align: center;
  }
  .panel h2 { margin: 0 0 8px; font-size: 20px; }
  .panel p { margin: 0 0 16px; font-size: 13px; color: #666; line-height: 1.6; }

  /* 选对手界面 */
  #setup {
    position: fixed; inset: 0; background: #0f5132; z-index: 60;
    display: flex; flex-direction: column; padding: 16px 14px;
  }
  #setup.hide { display: none; }
  #setup h1 { margin: 4px 0 2px; font-size: 20px; text-align: center; }
  #setup .sub { text-align: center; font-size: 12px; opacity: .75; margin-bottom: 14px; }
  .plist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 420px) { .plist { grid-template-columns: repeat(3, 1fr); } }
  .pitem {
    background: rgba(255,255,255,.12); border: 2px solid transparent;
    border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer;
    transition: .12s;
  }
  .pitem.on { border-color: #ffb703; background: rgba(255,183,3,.18); }
  .pitem .av {
    width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 6px;
    background: #2e7d5b; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; overflow: hidden;
  }
  .pitem .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pitem .nm { font-size: 12px; }
  .setup-bar { margin-top: auto; padding-top: 14px; }
  #setup { overflow-y: auto; }
  .sec { font-size: 13px; opacity: .85; margin: 8px 0 6px; }
  .pitem.dim { opacity: .35; }

  .ai .row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ai .av2 {
    width: 114px; height: 114px; border-radius: 50%; background: #2e7d5b;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 700; overflow: hidden; flex: 0 0 auto;
    border: 3px solid rgba(255,255,255,.4);
  }
  .ai .av2 img { width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 380px) {
    .card { width: 36px; height: 52px; }
    .card .r { font-size: 15px; }
    .card .s { font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <span class="title">跑得快</span>
  <span class="info"><span id="info">第 1 局</span> <span id="soundBtn" style="cursor:pointer;margin-left:10px">🔊</span><span id="musicBtn" style="cursor:pointer;margin-left:8px">🎵</span></span>
</header>

<div id="setup">
  <h1>跑得快</h1>
  <div class="sec">① 我是谁（选 1 人）</div>
  <div class="plist" id="myList"></div>
  <div class="sec">② 对手（选 2 人）</div>
  <div class="plist" id="opList"></div>
  <div class="setup-bar">
    <button class="btn primary" id="btnStart" disabled>开始游戏</button>
  </div>
</div>

<div class="table">
  <div class="ai-row">
    <div class="ai" id="ai1">
      <div class="row"><span class="av2" id="av1">A</span><span class="name" id="nm1">电脑A</span></div>
      <div class="cnt" id="cnt1">18 张</div>
    </div>
    <div class="ai" id="ai2">
      <div class="row"><span class="av2" id="av2">B</span><span class="name" id="nm2">电脑B</span></div>
      <div class="cnt" id="cnt2">18 张</div>
    </div>
  </div>

  <div class="board">
    <div class="slot" id="slotA"></div>
    <div class="slot" id="slotB"></div>
  </div>
  <div class="play-tip" id="playTip"></div>
  <div class="last-info" id="lastInfo"></div>
</div>

<div class="me-bar">
  <span class="av3" id="avMe"></span>
  <span class="nm3" id="nmMe">我</span>
  <span class="cnt3" id="cntMe">18 张</span>
</div>
<div class="my-cards" id="myCards"></div>

<div class="bar">
  <button class="btn ghost" id="btnNew">重开</button>
  <button class="btn" id="btnPass">过</button>
  <button class="btn primary" id="btnPlay">出牌</button>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">出完了！</h2>
    <p id="ovText"></p>
    <button class="btn primary" id="ovBtn">再来一局</button>
  </div>
</div>

  // ---------- 牌 ----------
  function buildDeck() {
    var deck = [], id = 0;
    for (var r = 3; r <= 15; r++) {
      for (var si = 0; si < 4; si++) {
        deck.push({ id: id++, rank: r, suit: SUITS[si], red: !!RED[SUITS[si]] });
      }
    }
    deck.push({ id: id++, rank: 16, suit: "", red: false, joker: true }); // 小王
    deck.push({ id: id++, rank: 17, suit: "", red: true, joker: true });  // 大王
    return deck;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function sortDesc(cards) {
    return cards.slice().sort(function (x, y) {
      if (y.rank !== x.rank) return y.rank - x.rank;
      return x.suit < y.suit ? -1 : 1;
    });
  }

  // ---------- 牌型判断 ----------
  // 返回 {type, len, key} 或 null
  function parsePlay(cards) {
    if (!cards || !cards.length) return null;
    var n = cards.length;
    var ranks = cards.map(function (c) { return c.rank; }).sort(function (a, b) { return a - b; });

    // 王炸
    if (n === 2 && ranks[0] === 16 && ranks[1] === 17) {
      return { type: "rocket", len: 2, key: 100 };
    }

    var cnt = {};
    ranks.forEach(function (r) { cnt[r] = (cnt[r] || 0) + 1; });
    var keys = Object.keys(cnt).map(Number).sort(function (a, b) { return a - b; });
    var groups = keys.map(function (r) { return { rank: r, n: cnt[r] }; });
    groups.sort(function (a, b) { return b.n - a.n || a.rank - b.rank; });

    // 炸弹
    if (n === 4 && groups.length === 1) {
      return { type: "bomb", len: 4, key: groups[0].rank };
    }

    // 单张
    if (n === 1) return { type: "single", len: 1, key: ranks[0] };

    // 对子
    if (n === 2) {
      if (groups.length === 1 && groups[0].n === 2) return { type: "pair", len: 2, key: groups[0].rank };
      return null;
    }

    // 三张
    if (n === 3) {
      if (groups.length === 1 && groups[0].n === 3) return { type: "trio", len: 3, key: groups[0].rank };
      return null;
    }

    // 三带一 / 三带二
    if (n === 4 && groups.length === 2 && groups[0].n === 3) {
      return { type: "trio1", len: 4, key: groups[0].rank };
    }
    if (n === 5 && groups.length === 2 && groups[0].n === 3 && groups[1].n === 2) {
      return { type: "trio2", len: 5, key: groups[0].rank };
    }

    if (n >= 5) {
      // 顺子：>=5 张，连续，最大到 A(14)，2 和王不能进顺子
      var allSingle = groups.every(function (g) { return g.n === 1; });
      if (allSingle && ranks[n - 1] <= 14) {
        var ok = true;
        for (var i = 1; i < n; i++) if (ranks[i] !== ranks[i - 1] + 1) { ok = false; break; }
        if (ok) return { type: "straight", len: n, key: ranks[n - 1] };
      }

      // 连对：>=3 对，连续，最大到 A
      if (n % 2 === 0) {
        var allPair = groups.every(function (g) { return g.n === 2; });
        if (allPair && groups.length >= 3) {
          var hi = groups[groups.length - 1].rank;
          var ok2 = hi <= 14;
          for (var j = 1; j < groups.length && ok2; j++) {
            if (groups[j].rank !== groups[j - 1].rank + 1) ok2 = false;
          }
          if (ok2) return { type: "pairseq", len: n, key: hi };
        }
      }
      return null;
    }

    return null;
  }

  function canBeat(play, prev) {
    if (!play) return false;
    if (!prev) return true;
    if (play.type === "rocket") return true;
    if (prev.type === "rocket") return false;
    if (play.type === "bomb" && prev.type !== "bomb") return true;
    if (prev.type === "bomb" && play.type !== "bomb") return false;
    if (play.type !== prev.type) return false;
    if (play.len !== prev.len) return false;
    return play.key > prev.key;
  }

  // ---------- 渲染 ----------
  function cardEl(c, small) {
    var el = document.createElement("div");
    el.className = (small ? "mini" : "card") + (c.red ? " red" : "") + (c.joker ? " joker" : "");
    var r = document.createElement("span");
    r.className = "r";
    var s = document.createElement("span");
    s.className = "s";
    if (c.rank === 16) { r.textContent = "\u5c0f"; s.textContent = "\u738b"; }
    else if (c.rank === 17) { r.textContent = "\u5927"; s.textContent = "\u738b"; }
    else { r.textContent = RANK_TXT[c.rank]; s.textContent = c.suit; }
    el.appendChild(r); el.appendChild(s);
    return el;
  }

  function render() {
    var box = document.getElementById("myCards");
    box.innerHTML = "";
    state.my.forEach(function (c) {
      var el = cardEl(c, false);
      if (state.sel[c.id]) el.classList.add("sel");
      el.addEventListener("click", function () { toggle(c.id); });
      box.appendChild(el);
    });

    document.getElementById("cnt1").textContent = state.ai[0].length + " 张";
    document.getElementById("cnt2").textContent = state.ai[1].length + " 张";
    document.getElementById("cntMe").textContent = state.my.length + " 张";
    var avMe = document.getElementById("avMe");
    if (avMe) {
      avMe.innerHTML = "";
      if (state.myImg) {
        var mi = document.createElement("img");
        mi.src = state.myImg;
        avMe.appendChild(mi);
      } else {
        avMe.textContent = (state.myName || "\u6211").slice(0, 1);
      }
    }
    var nmMe = document.getElementById("nmMe");
    if (nmMe) nmMe.textContent = state.myName || "\u6211";
    document.getElementById("nm1").textContent = state.names[0];
    document.getElementById("nm2").textContent = state.names[1];
    setAv("av1", state.names[0], state.imgs[0]);
    setAv("av2", state.names[1], state.imgs[1]);

    document.getElementById("ai1").classList.toggle("active", state.turn === 1);
    document.getElementById("ai2").classList.toggle("active", state.turn === 2);
    document.getElementById("info").textContent = "第 " + state.round + " 局";

    var sA = document.getElementById("slotA");
    var sB = document.getElementById("slotB");
    sA.innerHTML = ""; sB.innerHTML = "";
    if (state.lastPlay && state.lastPlay.by === 1) drawSlot(sA, state.lastPlay.cards);
    if (state.lastPlay && state.lastPlay.by === 2) drawSlot(sB, state.lastPlay.cards);

    var info = document.getElementById("lastInfo");
    if (state.over) info.textContent = "";
    else if (state.turn === 0) info.textContent = state.lastPlay ? "轮到你，管不上可以过" : "你先出牌";
    else info.textContent = "电脑思考中…";

    var canAct = !state.over && state.turn === 0;
    document.getElementById("btnPlay").disabled = !canAct;
    document.getElementById("btnPass").disabled = !canAct || !state.lastPlay;

    // 我的上一手显示
    if (state.lastPlay && state.lastPlay.by === 0) {
      var slots = document.querySelector(".board");
      if (!document.getElementById("slotMe")) {
        var d = document.createElement("div");
        d.className = "slot"; d.id = "slotMe";
        slots.appendChild(d);
      }
      var sm = document.getElementById("slotMe");
      sm.innerHTML = "";
      drawSlot(sm, state.lastPlay.cards);
    }
  }

  function drawSlot(el, cards) {
    sortDesc(cards).forEach(function (c) { el.appendChild(cardEl(c, true)); });
  }

  function toggle(id) {
    if (state.over || state.turn !== 0) return;
    sfx("sel");
    if (state.sel[id]) delete state.sel[id];
    else state.sel[id] = 1;
    render();
  }

  function selectedCards() {
    return state.my.filter(function (c) { return state.sel[c.id]; });
  }

  // ---------- 游戏流程 ----------
  function setAv(id, name, img) {
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = "";
    if (img) {
      var im = document.createElement("img");
      im.src = img;
      el.appendChild(im);
    } else {
      el.textContent = (name || "?").slice(0, 1);
    }
  }

  // ===== 音效 / 背景音乐（全部用 WebAudio 合成，无音频文件）=====
  var AC = null, bgmOn = true, bgmTimer = null, bgmStep = 0;

  function ac() {
    if (!AC) {
      try {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        AC = new Ctx();
      } catch (e) { return null; }
    }
    if (AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
    return AC;
  }

  function tone(freq, dur, type, vol, delay) {
    var a = ac();
    if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var osc = a.createOscillator();
    var g = a.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol) {
    var a = ac();
    if (!a) return;
    var n = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, n, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = a.createBufferSource(); src.buffer = buf;
    var g = a.createGain(); g.gain.value = vol || 0.15;
    var f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1200;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
  }

  function sfx(kind) {
    if (!bgmOn) return;
    switch (kind) {
      case "sel":    tone(880, 0.06, "triangle", 0.05); break;
      case "play":   tone(520, 0.09, "square", 0.06); tone(700, 0.08, "square", 0.04, 0.05); break;
      case "pass":   tone(240, 0.12, "sine", 0.07); break;
      case "bomb":   noise(0.28, 0.22); tone(90, 0.3, "sawtooth", 0.12); break;
      case "win":    [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.28, "triangle", 0.1, i * 0.13); }); break;
      case "lose":   [392, 330, 262].forEach(function (f, i) { tone(f, 0.3, "sine", 0.09, i * 0.15); }); break;
    }
  }

  // 背景音乐：Am - F - C - G 循环，柔和的三角波和弦
  var CHORDS = [
    [220, 261.6, 329.6],
    [174.6, 220, 261.6],
    [261.6, 329.6, 392],
    [196, 246.9, 293.7]
  ];

  function bgmStart() {
    if (!bgmOn || bgmTimer) return;
    var a = ac();
    if (!a) return;
    bgmStep = 0;
    bgmTimer = setInterval(function () {
      if (!bgmOn) return;
      var ch = CHORDS[bgmStep % CHORDS.length];
      bgmStep++;
      ch.forEach(function (f, i) {
        var t0 = a.currentTime + i * 0.04;
        var osc = a.createOscillator();
        var g = a.createGain();
        osc.type = "triangle";
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.022, t0 + 0.5);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.9);
        osc.connect(g); g.connect(a.destination);
        osc.start(t0); osc.stop(t0 + 2.0);
      });
    }, 2000);
  }

  function bgmStop() {
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
  }

  // ===== 轻快背景音乐（合成，无音频文件）=====
  var musicOn = true, musicTimer = null, musicStep = 0;
  var N = {
    C3: 130.81, F2: 87.31, G2: 98.00, A2: 110.00,
    C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46,
    G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50
  };
  var MELODY = [
    "C5","E5","G5","E5","A5","G5","E5","C5",
    "D5","F5","A5","F5","G5","E5","D5","C5",
    "C5","E5","G5","C6","B5","G5","E5","D5",
    "F5","A5","G5","E5","D5","C5","E5","G5"
  ];
  var BASS_LINE = ["C3","C3","A2","A2","F2","F2","G2","G2"];

  function pluck(freq, dur, vol, type, delay) {
    var a = ac();
    if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function musicStart() {
    if (!musicOn || musicTimer) return;
    if (!ac()) return;
    musicStep = 0;
    musicTimer = setInterval(function () {
      if (!musicOn) return;
      var n = MELODY[musicStep % MELODY.length];
      pluck(N[n], 0.16, 0.028, "triangle");
      if (musicStep % 4 === 0) {
        var b = BASS_LINE[(musicStep / 4) % BASS_LINE.length];
        pluck(N[b], 0.34, 0.03, "sine");
      }
      if (musicStep % 8 === 4) pluck(N.C6, 0.06, 0.012, "square");
      musicStep++;
    }, 200);
  }

  function musicStop() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  // ===== 语音播报（系统 TTS，无音频文件）=====
  var voiceOn = true;
  var RANK_SPEAK = {
    3: "3", 4: "4", 5: "5", 6: "6", 7: "7", 8: "8", 9: "9", 10: "10",
    11: "勾", 12: "圈", 13: "凯", 14: "尖", 15: "2", 16: "小王", 17: "大王"
  };
  var TYPE_SPEAK = {
    single: "单张", pair: "对", trio: "三张", trio1: "三带一",
    trio2: "三带二", straight: "顺子", pairseq: "连对",
    bomb: "炸弹", rocket: "王炸"
  };

  function describePlay(play, cards) {
    var t = play.type;
    var cs = cards || [];
    var k = RANK_SPEAK[play.key];

    if (t === "rocket") return "王炸";
    if (t === "bomb") return "炸弹" + k;
    if (t === "single") return k;
    if (t === "pair") return "一对" + k;
    if (t === "trio") return "三个" + k;

    if (t === "trio1" || t === "trio2") {
      var kicker = null;
      for (var i = 0; i < cs.length; i++) {
        if (cs[i].rank !== play.key) { kicker = cs[i].rank; break; }
      }
      var kk = kicker === null ? "" : RANK_SPEAK[kicker];
      if (t === "trio1") return "三个" + k + "带" + kk;
      return "三个" + k + "带一对" + kk;
    }

    if (t === "straight" || t === "pairseq") {
      var rs = cs.map(function (c) { return c.rank; }).sort(function (a, b) { return a - b; });
      if (!rs.length) return TYPE_SPEAK[t] || "出牌";
      var lo = RANK_SPEAK[rs[0]], hi = RANK_SPEAK[rs[rs.length - 1]];
      return (t === "straight" ? "顺子" : "连对") + lo + "到" + hi;
    }

    return TYPE_SPEAK[t] || "出牌";
  }

  var tipTimer = null;
  function showTip(text) {
    var el = document.getElementById("playTip");
    if (!el) return;
    el.textContent = text;
    el.classList.add("show");
    if (tipTimer) clearTimeout(tipTimer);
    tipTimer = setTimeout(function () { el.classList.remove("show"); }, 1200);
  }

  function speak(text) {
    if (!voiceOn || !text) return;
    if (!("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 1.15;
      u.pitch = 1.0;
      u.volume = 1.0;
      var vs = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < vs.length; i++) {
        if (/zh/i.test(vs[i].lang)) { u.voice = vs[i]; break; }
      }
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function renderPlayers() {
    var myBox = document.getElementById("myList");
    var opBox = document.getElementById("opList");
    myBox.innerHTML = "";
    opBox.innerHTML = "";

    PLAYERS.forEach(function (pl, i) {
      var d = document.createElement("div");
      d.className = "pitem" + (selMe === i ? " on" : "");
      d.appendChild(makeAv(pl));
      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = pl.name;
      d.appendChild(nm);
      d.addEventListener("click", function () {
        selMe = i;
        selOpps = selOpps.filter(function (x) { return x !== i; });
        renderPlayers();
      });
      myBox.appendChild(d);

      var d2 = document.createElement("div");
      var picked = selOpps.indexOf(i) >= 0;
      d2.className = "pitem" + (picked ? " on" : "") + (selMe === i ? " dim" : "");
      d2.appendChild(makeAv(pl));
      var nm2 = document.createElement("div");
      nm2.className = "nm";
      nm2.textContent = pl.name;
      d2.appendChild(nm2);
      d2.addEventListener("click", function () {
        if (selMe === i) return;
        var k = selOpps.indexOf(i);
        if (k >= 0) selOpps.splice(k, 1);
        else {
          if (selOpps.length >= 2) selOpps.shift();
          selOpps.push(i);
        }
        renderPlayers();
      });
      opBox.appendChild(d2);
    });

    document.getElementById("btnStart").disabled = !(selMe >= 0 && selOpps.length === 2);
  }

  function makeAv(pl) {
    var av = document.createElement("div");
    av.className = "av";
    if (pl.img) {
      var im = document.createElement("img");
      im.src = pl.img;
      av.appendChild(im);
    } else {
      av.textContent = pl.name.slice(0, 1);
    }
    return av;
  }

  function newGame() {
    TOTAL_ROUNDS++;
    var deck = shuffle(buildDeck());
    var my = sortDesc(deck.slice(0, 18));
    var a1 = sortDesc(deck.slice(18, 36));
    var a2 = sortDesc(deck.slice(36, 54));

    var me = PLAYERS[selMe] || { name: "\u6211", img: MY_IMG };
    var opps = selOpps.map(function (i) { return PLAYERS[i]; });
    if (opps.length !== 2) {
      opps = [{ name: "\u7535\u8111A", img: "" }, { name: "\u7535\u8111B", img: "" }];
    }
    state = {
      myName: me.name,
      myImg: me.img || MY_IMG,
      names: [opps[0].name, opps[1].name],
      imgs: [opps[0].img, opps[1].img],
      my: my,
      ai: [a1, a2],
      sel: {},
      turn: 0,
      lastPlay: null,   // {by, cards, play}
      passed: 0,
      over: false,
      round: TOTAL_ROUNDS,
      winner: -1
    };

    document.getElementById("overlay").classList.remove("show");
    var slotMe = document.getElementById("slotMe");
    if (slotMe) slotMe.remove();
    document.getElementById("slotA").innerHTML = "";
    document.getElementById("slotB").innerHTML = "";

    render();
  }

  function actPlay(player, cards) {
    var play = parsePlay(cards);
    if (!play) return false;
    if (!canBeat(play, state.lastPlay ? state.lastPlay.play : null)) return false;

    if (player === 0) {
      cards.forEach(function (c) {
        var i = state.my.findIndex(function (x) { return x.id === c.id; });
        if (i >= 0) state.my.splice(i, 1);
      });
      state.sel = {};
    } else {
      cards.forEach(function (c) {
        var i = state.ai[player - 1].findIndex(function (x) { return x.id === c.id; });
        if (i >= 0) state.ai[player - 1].splice(i, 1);
      });
    }

    if (play.type === "bomb" || play.type === "rocket") sfx("bomb");
    else sfx("play");
    var _txt = describePlay(play, cards);
    showTip(_txt);
    speak(_txt);
    state.lastPlay = { by: player, cards: cards, play: play };
    state.passed = 0;

    if (player === 0) {
      var sm = document.getElementById("slotMe");
      if (!sm) {
        sm = document.createElement("div");
        sm.className = "slot"; sm.id = "slotMe";
        document.querySelector(".board").appendChild(sm);
      }
      sm.innerHTML = "";
      drawSlot(sm, cards);
    } else {
      document.getElementById("slotA").innerHTML = "";
      document.getElementById("slotB").innerHTML = "";
    }

    if (player === 0 && state.my.length === 0) { finish(0); return true; }
    if (player > 0 && state.ai[player - 1].length === 0) { finish(player); return true; }

    state.turn = (player + 1) % 3;
    render();
    if (state.turn !== 0) setTimeout(aiTurn, 700);
    return true;
  }

  function actPass(player) {
    sfx("pass");
    showTip("过");
    speak("过");
    state.passed++;
    if (state.passed >= 2) {
      // 两家都过，上一手的人重新自由出
      var lastBy = state.lastPlay ? state.lastPlay.by : 0;
      state.lastPlay = null;
      state.passed = 0;
      state.turn = lastBy;
      var sm = document.getElementById("slotMe");
      if (sm) sm.remove();
      document.getElementById("slotA").innerHTML = "";
      document.getElementById("slotB").innerHTML = "";
      render();
      if (state.turn !== 0) setTimeout(aiTurn, 700);
      return;
    }
    state.turn = (player + 1) % 3;
    render();
    if (state.turn !== 0) setTimeout(aiTurn, 700);
  }

  function finish(winner) {
    state.over = true;
    state.winner = winner;
    var names = ["你", "电脑A", "电脑B"];
    var left = winner === 0 ? state.ai[0].length + state.ai[1].length
      : (winner === 1 ? state.my.length + state.ai[1].length : state.my.length + state.ai[0].length);

    document.getElementById("ovTitle").textContent =
      winner === 0 ? "\u4f60\u8d62\u4e86\uff01" : names[winner] + " 先出完";
    document.getElementById("ovText").textContent =
      winner === 0 ? "对手还剩 " + left + " 张牌" : "再接再厉，还剩 " + left + " 张";
    sfx(winner === 0 ? "win" : "lose");
    document.getElementById("overlay").classList.add("show");
    render();
  }

  // ---------- 电脑 AI ----------
  function groupByRank(hand) {
    var m = {};
    hand.forEach(function (c) { (m[c.rank] = m[c.rank] || []).push(c); });
    return m;
  }

  function pickByRank(hand, rank, n) {
    return hand.filter(function (c) { return c.rank === rank; }).slice(0, n);
  }

  function aiCandidates(hand, prev) {
    var g = groupByRank(hand);
    var ranks = Object.keys(g).map(Number).sort(function (a, b) { return a - b; });
    var out = [];

    function push(cards) {
      var p = parsePlay(cards);
      if (p && canBeat(p, prev ? prev.play : null)) out.push({ cards: cards, play: p });
    }

    // 单张
    ranks.forEach(function (r) { push([g[r][0]]); });
    // 对子
    ranks.forEach(function (r) { if (g[r].length >= 2) push(g[r].slice(0, 2)); });
    // 三张
    ranks.forEach(function (r) { if (g[r].length >= 3) push(g[r].slice(0, 3)); });
    // 三带一 / 三带二
    ranks.forEach(function (r) {
      if (g[r].length >= 3) {
        var trio = g[r].slice(0, 3);
        var others = hand.filter(function (c) { return c.rank !== r; });
        if (others.length) push(trio.concat([others[others.length - 1]]));
        var pairRank = -1;
        Object.keys(g).map(Number).sort(function (a, b) { return b - a; }).forEach(function (rr) {
          if (rr !== r && g[rr].length >= 2 && pairRank < 0) pairRank = rr;
        });
        if (pairRank > 0) push(trio.concat(g[pairRank].slice(0, 2)));
      }
    });

    // 顺子（只在跟顺子或自由出时考虑，简化：长度 5）
    if (!prev || prev.play.type === "straight") {
      var need = prev ? prev.play.len : 5;
      for (var start = 3; start + need - 1 <= 14; start++) {
        var ok = true, cs = [];
        for (var k = 0; k < need; k++) {
          var rr2 = start + k;
          if (!g[rr2] || !g[rr2].length) { ok = false; break; }
          cs.push(g[rr2][0]);
        }
        if (ok) push(cs);
      }
    }

    // 炸弹
    ranks.forEach(function (r) { if (g[r].length === 4) push(g[r].slice(0, 4)); });
    // 王炸
    if (g[16] && g[17]) push([g[16][0], g[17][0]]);

    return out;
  }

  function aiTurn() {
    if (state.over) return;
    var idx = state.turn - 1;
    var hand = state.ai[idx];
    var prev = state.lastPlay;

    var cands = aiCandidates(hand, prev);
    if (!cands.length) { actPass(state.turn); return; }

    // 如果上一手是自己出的，必须自由出（lastPlay 已被清空，这里不会发生）
    // 优先出小牌；只有对手快没牌时才用炸弹
    cands.sort(function (x, y) {
      var bx = x.play.type === "bomb" || x.play.type === "rocket" ? 1 : 0;
      var by = y.play.type === "bomb" || y.play.type === "rocket" ? 1 : 0;
      if (bx !== by) return bx - by;
      if (x.play.key !== y.play.key) return x.play.key - y.play.key;
      return x.cards.length - y.cards.length;
    });

    var danger = state.my.length <= 2 || state.ai[1 - idx].length <= 2;
    var pick = cands[0];
    if (danger) {
      // 危险时优先大牌
      pick = cands[cands.length - 1];
    }

    actPlay(state.turn, pick.cards);
  }

  // ---------- 交互 ----------
  document.getElementById("btnPlay").addEventListener("click", function () {
    if (state.over || state.turn !== 0) return;
    var cards = selectedCards();
    if (!cards.length) { alert("\u8bf7\u5148\u9009\u724c"); return; }
    var play = parsePlay(cards);
    if (!play) { alert("\u724c\u578b\u4e0d\u5408\u6cd5"); return; }
    if (!canBeat(play, state.lastPlay ? state.lastPlay.play : null)) {
      alert("\u7ba1\u4e0d\u4e0a\uff0c\u8bf7\u91cd\u9009\u6216\u70b9\u8fc7");
      return;
    }
    actPlay(0, cards);
  });

  document.getElementById("btnPass").addEventListener("click", function () {
    if (state.over || state.turn !== 0) return;
    if (!state.lastPlay) { alert("\u4f60\u5148\u51fa\u724c\uff0c\u4e0d\u80fd\u8fc7"); return; }
    state.sel = {};
    actPass(0);
  });

  document.getElementById("ovBtn").addEventListener("click", newGame);

  // 语音开关
  document.getElementById("soundBtn").addEventListener("click", function (e) {
    voiceOn = !voiceOn;
    e.target.textContent = voiceOn ? "\U0001F50A" : "\U0001F507";
    if (!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
  });

  // 音乐开关
  document.getElementById("musicBtn").addEventListener("click", function (e) {
    musicOn = !musicOn;
    e.target.style.opacity = musicOn ? "1" : ".35";
    if (musicOn) musicStart(); else musicStop();
  });

  // 浏览器要求先有点击才能放声音
  document.addEventListener("pointerdown", function once() {
    ac();
    if (musicOn) musicStart();
    document.removeEventListener("pointerdown", once);
  });

  renderPlayers();
  document.getElementById("btnStart").addEventListener("click", function () {
    if (!(selMe >= 0 && selOpps.length === 2)) return;
    document.getElementById("setup").classList.add("hide");
    newGame();
  });

  // 重开时回到选人界面
  document.getElementById("btnNew").addEventListener("click", function () {
    if (!confirm("\u786e\u5b9a\u91cd\u65b0\u9009\u62e9\u5bf9\u624b\uff1f")) return;
    document.getElementById("setup").classList.remove("hide");
    selMe = -1;
    selOpps = [];
    renderPlayers();
    document.getElementById("btnStart").disabled = true;
  });
})();
</script>
</body>
