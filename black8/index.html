<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中式黑8</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #10241a; color: #eaf3ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: rgba(0,0,0,.3); font-size: 13px;
  }
  header .title { font-weight: 600; letter-spacing: 1px; }
  header .players { display: flex; gap: 14px; align-items: center; }
  .pl { display: flex; align-items: center; gap: 6px; opacity: .55; }
  .pl.active { opacity: 1; }
  .pl .av {
    width: 30px; height: 30px; border-radius: 50%; overflow: hidden;
    background: #2e7d5b; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; border: 2px solid transparent;
  }
  .pl.active .av { border-color: #ffb703; }
  .pl .av img { width: 100%; height: 100%; object-fit: cover; }

  #wrap { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }

  .side {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 124px; text-align: center; z-index: 6; pointer-events: none;
  }
  .side.left { left: 0; }
  .side.right { right: 0; }
  .side .bigav {
    width: 114px; height: 114px; border-radius: 50%; margin: 0 auto 8px;
    background: #2e7d5b; overflow: hidden; display: flex; align-items: center;
    justify-content: center; font-size: 38px; font-weight: 700;
    border: 4px solid rgba(255,255,255,.28); transition: border-color .15s, transform .15s;
  }
  .side .bigav img { width: 100%; height: 100%; object-fit: cover; }
  .side.active .bigav { border-color: #ffb703; transform: scale(1.08); }
  .side .sname { font-size: 14px; opacity: .95; white-space: nowrap; font-weight: 600; }
  .side .sleft { font-size: 12px; opacity: .7; margin-top: 3px; }

  .hud {
    position: absolute; left: 10px; top: 8px; font-size: 12px; line-height: 1.6;
    background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 8px; pointer-events: none;
  }
  .hud b { color: #ffd166; }

  .msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(.9);
    background: rgba(0,0,0,.78); color: #ffd166; font-size: 20px; font-weight: 700;
    padding: 12px 22px; border-radius: 14px; opacity: 0; pointer-events: none;
    transition: opacity .18s, transform .18s; text-align: center; line-height: 1.5;
  }
  .msg.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  .bar {
    flex: 0 0 auto; display: flex; gap: 10px; padding: 10px 12px 14px;
    background: rgba(0,0,0,.3);
  }
  .btn {
    flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px;
    font-weight: 600; font-family: inherit; background: #f1f3f4; color: #222; cursor: pointer;
  }
  .btn.primary { background: #ffb703; color: #3a2a00; }
  .btn:disabled { opacity: .45; }

  /* 选人界面 */
  #setup {
    position: fixed; inset: 0; background: #0d2a1c; z-index: 60;
    display: flex; flex-direction: column; padding: 14px; overflow-y: auto;
  }
  #setup.hide { display: none; }
  #setup h1 { margin: 4px 0 2px; font-size: 20px; text-align: center; }
  #setup .sub { text-align: center; font-size: 12.5px; opacity: .8; margin-bottom: 12px; }
  .sec { font-size: 13px; opacity: .85; margin: 8px 0 6px; }
  .plist { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  @media (max-width: 420px) { .plist { grid-template-columns: repeat(3, 1fr); } }
  .pitem {
    background: rgba(255,255,255,.1); border: 2px solid transparent;
    border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer;
  }
  .pitem.on { border-color: #ffb703; background: rgba(255,183,3,.16); }
  .pitem.dim { opacity: .35; }
  .pitem .av {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 6px;
    background: #2e7d5b; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; overflow: hidden;
  }
  .pitem .av img { width: 100%; height: 100%; object-fit: cover; }
  .pitem .nm { font-size: 12px; }
  .setup-bar { margin-top: auto; padding-top: 12px; }
  .setup-bar .btn { width: 100%; }
</style>
</head>
<body>

<header>
  <span class="title">中式黑8</span>
  <span class="players">
    <span id="turnText">轮到你</span>
    <span id="soundBtn" style="cursor:pointer;margin-left:10px">🔊</span>
    <span id="musicBtn" style="cursor:pointer;margin-left:6px">🎵</span>
  </span>
</header>


<div id="setup">
  <h1>中式黑8</h1>
  <div class="sub">选择你的角色和对手</div>
  <div class="sec">① 我是谁（选 1 人）</div>
  <div class="plist" id="myList"></div>
  <div class="sec">② 对手（选 1 人）</div>
  <div class="plist" id="opList"></div>
  <div class="setup-bar">
    <button class="btn primary" id="btnStart" disabled>开始比赛</button>
  </div>
</div>

<div id="wrap">
  <div class="side left" id="sideMe">
    <div class="bigav" id="avMe">我</div>
    <div class="sname" id="nmMe">我</div>
    <div class="sleft" id="leftMe"></div>
  </div>
  <div class="side right" id="sideAi">
    <div class="bigav" id="avAi">AI</div>
    <div class="sname" id="nmAi">电脑</div>
    <div class="sleft" id="leftAi"></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="hud" id="hud"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="bar">
  <button class="btn" id="btnNew">重开</button>
  <button class="btn primary" id="btnHint">提示</button>
</div>

<script>
(function () {
  "use strict";

  // ================== 基础参数（世界坐标，竖版球台）==================
  var W = 640, H = 1240;          // 台面内区尺寸（1:2 稍窄）
  var R = 22;                     // 球半径
  var POCKET_R = 58;              // 袋口半径
  var RAIL = 46;                  // 库边厚度（渲染用）
  var FRICTION = 430;             // 摩擦减速度（单位/秒²）
  var CUSHION = 0.86;             // 库边弹性
  var BALL_E = 0.96;              // 球球弹性
  var STOP_V = 9;                 // 视为静止的速度阈值

  var POCKETS = [
    { x: 0, y: 0 }, { x: W, y: 0 },
    { x: 0, y: H / 2 }, { x: W, y: H / 2 },
    { x: 0, y: H }, { x: W, y: H }
  ];

  var COLORS = {
    1: "#f4d03f", 2: "#2e86de", 3: "#e74c3c", 4: "#8e44ad",
    5: "#e67e22", 6: "#16a085", 7: "#7f2b2b", 8: "#111111",
    9: "#f4d03f", 10: "#2e86de", 11: "#e74c3c", 12: "#8e44ad",
    13: "#e67e22", 14: "#16a085", 15: "#7f2b2b"
  };

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var scale = 1, offX = 0, offY = 0;

  // ================== 状态 ==================
  var balls = [];        // {n, x, y, vx, vy, potted}
  var cue = null;        // 白球引用
  var running = false;   // 物理是否在跑
  var state = null;
  var aiming = false;
  var aimFrom = null, aimTo = null;
  var aiThinking = false;

  // ================== 工具 ==================
  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function len(x, y) { return Math.sqrt(x * x + y * y); }

  // ================== 音效 / 音乐（WebAudio 合成，无音频文件）==================
  var AC = null, sfxOn = true, musicOn = true, musicTimer = null, musicStep = 0;
  var lastHitT = 0;

  function ac() {
    if (!AC) {
      try {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        AC = new C();
      } catch (e) { return null; }
    }
    if (AC.state === "suspended") { try { AC.resume(); } catch (e) {} }
    return AC;
  }

  function blip(freq, dur, type, vol, slideTo) {
    if (!sfxOn) return;
    var a = ac(); if (!a) return;
    var t0 = a.currentTime;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noiseHit(dur, vol) {
    if (!sfxOn) return;
    var a = ac(); if (!a) return;
    var n = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, n, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = a.createBufferSource(); src.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.8;
    var g = a.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
  }

  // 球撞球
  function hitSound(strength) {
    var now = Date.now();
    if (now - lastHitT < 45) return;
    lastHitT = now;
    var v = Math.min(0.22, 0.05 + strength / 2600);
    blip(760 + Math.random() * 260, 0.05, "triangle", v);
    noiseHit(0.03, v * 0.6);
  }

  // 撞库
  function cushionSound(strength) {
    var now = Date.now();
    if (now - lastHitT < 55) return;
    lastHitT = now;
    blip(180, 0.09, "sine", Math.min(0.12, 0.03 + strength / 6000));
  }

  // 落袋
  function pocketSound() {
    blip(320, 0.16, "sine", 0.14, 120);
    setTimeout(function () { blip(160, 0.18, "sine", 0.1, 80); }, 90);
  }

  function winSound(win) {
    var seq = win ? [523, 659, 784, 1046] : [392, 330, 262];
    seq.forEach(function (f, i) { setTimeout(function () { blip(f, 0.26, "triangle", 0.12); }, i * 130); });
  }

  // 轻快背景循环
  var N = { C3:130.81, F2:87.31, G2:98.00, A2:110.00, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, C6:1046.5 };
  var MELODY = ["C5","E5","G5","E5","A5","G5","E5","C5","D5","F5","A5","F5","G5","E5","D5","C5"];
  var BASS = ["C3","C3","A2","A2","F2","F2","G2","G2"];

  function musicStart() {
    if (!musicOn || musicTimer) return;
    var a = ac(); if (!a) return;
    musicStep = 0;
    musicTimer = setInterval(function () {
      if (!musicOn) return;
      var n = MELODY[musicStep % MELODY.length];
      blip(N[n], 0.18, "triangle", 0.022);
      if (musicStep % 4 === 0) blip(N[BASS[(musicStep / 4) % BASS.length]], 0.36, "sine", 0.026);
      musicStep++;
    }, 240);
  }

  function musicStop() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  var selMe = -1, selOpp = -1;

  function makeAv(pl) {
    var av = document.createElement("div");
    av.className = "av";
    if (pl.img) {
      var im = document.createElement("img");
      im.src = pl.img;
      av.appendChild(im);
    } else {
      av.textContent = pl.name.slice(0, 1);
    }
    return av;
  }

  function renderPlayers() {
    var myBox = document.getElementById("myList");
    var opBox = document.getElementById("opList");
    myBox.innerHTML = "";
    opBox.innerHTML = "";

    PLAYERS.forEach(function (pl, i) {
      var a = document.createElement("div");
      a.className = "pitem" + (selMe === i ? " on" : "");
      a.appendChild(makeAv(pl));
      var n1 = document.createElement("div");
      n1.className = "nm"; n1.textContent = pl.name;
      a.appendChild(n1);
      a.addEventListener("click", function () {
        selMe = i;
        if (selOpp === i) selOpp = -1;
        renderPlayers();
      });
      myBox.appendChild(a);

      var b = document.createElement("div");
      b.className = "pitem" + (selOpp === i ? " on" : "") + (selMe === i ? " dim" : "");
      b.appendChild(makeAv(pl));
      var n2 = document.createElement("div");
      n2.className = "nm"; n2.textContent = pl.name;
      b.appendChild(n2);
      b.addEventListener("click", function () {
        if (selMe === i) return;
        selOpp = i;
        renderPlayers();
      });
      opBox.appendChild(b);
    });

    document.getElementById("btnStart").disabled = !(selMe >= 0 && selOpp >= 0);
  }

  function applyPlayers() {
    var me = PLAYERS[selMe], op = PLAYERS[selOpp];
    if (!me || !op) return;
    document.getElementById("nmMe").textContent = me.name;
    document.getElementById("nmAi").textContent = op.name;
    var avMe = document.getElementById("avMe"), avAi = document.getElementById("avAi");
    avMe.innerHTML = ""; avAi.innerHTML = "";
    if (me.img) { var i1 = document.createElement("img"); i1.src = me.img; avMe.appendChild(i1); }
    if (op.img) { var i2 = document.createElement("img"); i2.src = op.img; avAi.appendChild(i2); }
  }

  // ================== 建局 ==================
  function makeBall(n, x, y) {
    return { n: n, x: x, y: y, vx: 0, vy: 0, potted: false };
  }

  function rack() {
    balls = [];
    cue = makeBall(0, W * 0.5, H * 0.78);
    balls.push(cue);

    // 三角摆球（顶点朝上，靠近上方）
    var order = [1, 9, 2, 10, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15, 8];
    var idx = 0;
    var apexX = W / 2, apexY = H * 0.28;
    var dx = R * 1.78, dy = R * 1.55;
    for (var row = 0; row < 5; row++) {
      for (var i = 0; i <= row; i++) {
        var x = apexX + (i - row / 2) * dx;
        var y = apexY + row * dy;
        var n = order[idx++ % order.length];
        balls.push(makeBall(n, x, y));
      }
    }
    balls.sort(function (a, b) { return a.n - b.n; });
  }

  function newGame() {
    rack();
    state = {
      phase: "break",       // break / play / over
      turn: 0,              // 0=我 1=电脑
      groups: [null, null], // 'solid' | 'stripe'
      potted: {},
      ballInHand: false,
      winner: -1,
      msg: "开球"
    };
    running = false;
    aiming = false;
    aiThinking = false;
    showMsg("你开球：点球台拖动瞄准，松手击球");
    requestAnimationFrame(loop);
  }

  // ================== 物理 ==================
  function stepPhysics(dt) {
    var i, b, j, o;
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.potted) continue;
      if (b.vx === 0 && b.vy === 0) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // 摩擦
      var sp = len(b.vx, b.vy);
      if (sp > 0) {
        var dec = FRICTION * dt;
        var ns = Math.max(0, sp - dec);
        b.vx = b.vx / sp * ns;
        b.vy = b.vy / sp * ns;
        if (ns < STOP_V) { b.vx = 0; b.vy = 0; }
      }
    }

    // 球球碰撞
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.potted) continue;
      for (j = i + 1; j < balls.length; j++) {
        o = balls[j];
        if (o.potted) continue;
        var dx = o.x - b.x, dy = o.y - b.y;
        var d = len(dx, dy);
        if (d > 0 && d < R * 2) {
          var nx = dx / d, ny = dy / d;
          var overlap = R * 2 - d;
          b.x -= nx * overlap / 2; b.y -= ny * overlap / 2;
          o.x += nx * overlap / 2; o.y += ny * overlap / 2;
          var rvx = o.vx - b.vx, rvy = o.vy - b.vy;
          var vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            var imp = -(1 + BALL_E) * vn / 2;
            b.vx -= imp * nx; b.vy -= imp * ny;
            o.vx += imp * nx; o.vy += imp * ny;
            // 记录白球第一次碰到的是几号球
            hitSound(Math.abs(vn));
            if (state.firstContact === undefined) {
              if (b.n === 0 && o.n !== 0) state.firstContact = o.n;
              else if (o.n === 0 && b.n !== 0) state.firstContact = b.n;
            }
          }
        }
      }
    }

    // 库边
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.potted) continue;
      if (b.x - R < 0) { cushionSound(Math.abs(b.vx)); b.x = R; b.vx = Math.abs(b.vx) * CUSHION; }
      if (b.x + R > W) { cushionSound(Math.abs(b.vx)); b.x = W - R; b.vx = -Math.abs(b.vx) * CUSHION; }
      if (b.y - R < 0) { cushionSound(Math.abs(b.vy)); b.y = R; b.vy = Math.abs(b.vy) * CUSHION; }
      if (b.y + R > H) { cushionSound(Math.abs(b.vy)); b.y = H - R; b.vy = -Math.abs(b.vy) * CUSHION; }
    }

    // 落袋
    for (i = 0; i < balls.length; i++) {
      b = balls[i];
      if (b.potted) continue;
      for (j = 0; j < POCKETS.length; j++) {
        var p = POCKETS[j];
        if (len(b.x - p.x, b.y - p.y) < POCKET_R * 0.8) {
          b.potted = true;
          b.vx = 0; b.vy = 0;
          pocketSound();
          state.justPotted = state.justPotted || [];
          state.justPotted.push(b.n);
          break;
        }
      }
    }
  }

  function allStopped() {
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.potted) continue;
      if (b.vx !== 0 || b.vy !== 0) return false;
    }
    return true;
  }

  // ================== 规则 ==================
  function groupOf(n) {
    if (n === 8 || n === 0) return "eight";
    return n <= 7 ? "solid" : "stripe";
  }

  function remainingFor(pl) {
    var g = state.groups[pl];
    if (!g) return null;
    var cnt = 0;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (!b.potted && groupOf(b.n) === g) cnt++;
    }
    return cnt;
  }

  function clearedGroup(pl) {
    var r = remainingFor(pl);
    return r === 0;
  }

  // 结算一杆
  function resolveShot() {
    var potted = state.justPotted || [];
    var first = state.firstContact;
    var cuePotted = potted.indexOf(0) >= 0;
    var me = state.turn;
    var opp = 1 - me;
    var foul = false;
    var reason = "";

    if (cuePotted) { foul = true; reason = "白球落袋"; }
    else if (first === undefined) { foul = true; reason = "空杆"; }
    else if (state.groups[me]) {
      var g = state.groups[me];
      var needEight = clearedGroup(me);
      if (needEight) {
        if (first !== 8) { foul = true; reason = "该打8号球"; }
      } else if (groupOf(first) !== g) {
        foul = true; reason = "先碰到对方的球";
      }
    }

    // 8 号球处理
    var eightPotted = potted.indexOf(8) >= 0;
    if (eightPotted) {
      var legalEight = state.groups[me] && clearedGroup(me) && !foul;
      state.phase = "over";
      state.winner = legalEight ? me : opp;
      winSound(legalEight && me === 0);
      showMsg(legalEight ? "你赢了！" : "8号球提前落袋，你输了");
      updateHud();
      state.justPotted = [];
      state.firstContact = undefined;
      return;
    }

    // 分组（开球后第一次合法落袋）
    if (!state.groups[0] && !state.groups[1] && !foul) {
      var firstPotted = -1;
      for (var i = 0; i < potted.length; i++) {
        var n = potted[i];
        if (n !== 0 && n !== 8) { firstPotted = n; break; }
      }
      if (firstPotted > 0) {
        var g0 = groupOf(firstPotted);
        state.groups[me] = g0;
        state.groups[opp] = g0 === "solid" ? "stripe" : "solid";
        showMsg("你打" + (g0 === "solid" ? "全色（1-7）" : "花球（9-15）"));
      }
    }

    // 是否继续
    var pottedMine = false;
    for (var k = 0; k < potted.length; k++) {
      var nn = potted[k];
      if (nn === 0 || nn === 8) continue;
      if (!state.groups[me] || groupOf(nn) === state.groups[me]) { pottedMine = true; break; }
    }

    state.justPotted = [];
    state.firstContact = undefined;

    if (foul) {
      state.turn = opp;
      state.ballInHand = true;
      showMsg("犯规：" + reason + "，对方自由球");
    } else if (!pottedMine) {
      state.turn = opp;
      state.ballInHand = false;
      if (state.phase === "break") state.phase = "play";
    } else {
      state.ballInHand = false;
      if (state.phase === "break") state.phase = "play";
    }

    updateHud();
    if (state.phase !== "over") nextTurn();
  }

  function nextTurn() {
    if (state.turn === 0) {
      if (state.ballInHand) { showMsg("自由球：点击台面放置白球"); }
      aiThinking = false;
    } else {
      aiThinking = true;
      updateHud();
      setTimeout(aiShoot, 900);
    }
  }

  function cueBall() {
    for (var i = 0; i < balls.length; i++) if (balls[i].n === 0) return balls[i];
    return null;
  }

  // ================== AI ==================
  function pathClear(x1, y1, x2, y2, ignore) {
    var steps = 40;
    for (var s = 1; s < steps; s++) {
      var t = s / steps;
      var px = x1 + (x2 - x1) * t;
      var py = y1 + (y2 - y1) * t;
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (b.potted || b === cue) continue;
        if (ignore && ignore.indexOf(b.n) >= 0) continue;
        if (len(b.x - px, b.y - py) < R * 1.9) return false;
      }
    }
    return true;
  }

  function legalTargets() {
    var me = state.turn;
    var g = state.groups[me];
    var list = [];
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.potted || b.n === 0) continue;
      if (!g) { list.push(b); continue; }
      if (clearedGroup(me)) { if (b.n === 8) list.push(b); }
      else if (groupOf(b.n) === g) list.push(b);
    }
    return list;
  }

  function aiFindShot() {
    var cb = cueBall();
    if (!cb) return null;
    var targets = legalTargets();
    var best = null;

    for (var t = 0; t < targets.length; t++) {
      var tb = targets[t];
      for (var p = 0; p < POCKETS.length; p++) {
        var pk = POCKETS[p];
        var dxp = pk.x - tb.x, dyp = pk.y - tb.y;
        var dp = len(dxp, dyp);
        if (dp < 1) continue;
        var ux = dxp / dp, uy = dyp / dp;

        // 目标球到袋口是否畅通
        if (!pathClear(tb.x, tb.y, pk.x, pk.y, [tb.n])) continue;

        // 幽灵球位置
        var gx = tb.x - ux * R * 2;
        var gy = tb.y - uy * R * 2;
        if (gx < R || gx > W - R || gy < R || gy > H - R) continue;

        // 白球到幽灵球是否畅通
        if (!pathClear(cb.x, cb.y, gx, gy, [tb.n])) continue;

        // 角度
        var cdx = gx - cb.x, cdy = gy - cb.y;
        var cd = len(cdx, cdy);
        if (cd < 1) continue;
        var dot = (cdx / cd) * ux + (cdy / cd) * uy;
        if (dot < 0.25) continue;

        var score = dot * 100 - dp * 0.06 - cd * 0.04;
        if (!best || score > best.score) {
          best = { score: score, tx: gx, ty: gy, power: clamp(0.35 + cd / 1600 + dp / 2400, 0.3, 0.95) };
        }
      }
    }

    if (!best && targets.length) {
      // 没有进球机会：轻碰最近的合法球
      var near = targets[0], nd = 1e9;
      for (var i2 = 0; i2 < targets.length; i2++) {
        var d2 = len(targets[i2].x - cb.x, targets[i2].y - cb.y);
        if (d2 < nd) { nd = d2; near = targets[i2]; }
      }
      best = { score: 0, tx: near.x, ty: near.y, power: clamp(0.3 + nd / 2000, 0.28, 0.7) };
    }
    return best;
  }

  function aiShoot() {
    if (!state || state.turn !== 1 || state.phase === "over") return;
    var cb = cueBall();

    if (state.ballInHand && cb) {
      // 放到台面中间偏下，简单处理
      cb.potted = false;
      cb.x = W * 0.5;
      cb.y = H * 0.62;
      cb.vx = cb.vy = 0;
      state.ballInHand = false;
    }

    var shot = aiFindShot();
    if (!shot) { resolveShot(); return; }

    var dx = shot.tx - cb.x, dy = shot.ty - cb.y;
    var d = len(dx, dy) || 1;
    var speed = 480 + shot.power * 1140;
    cb.vx = dx / d * speed;
    cb.vy = dy / d * speed;

    state.justPotted = [];
    state.firstContact = undefined;
    running = true;
    aiThinking = false;
    updateHud();
  }

  // ================== 循环 ==================
  var lastT = 0;

  function loop(t) {
    if (!lastT) lastT = t;
    var dt = Math.min(0.05, (t - lastT) / 1000);
    lastT = t;

    if (running) {
      var sub = 4;
      for (var s = 0; s < sub; s++) stepPhysics(dt / sub);
      if (allStopped()) {
        running = false;
        resolveShot();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ================== 绘制 ==================
  function resize() {
    var wrap = document.getElementById("wrap");
    var sideSpace = wrap.clientWidth > 520 ? 140 : 116;
    var maxW = wrap.clientWidth - sideSpace;
    var maxH = wrap.clientHeight - 12;
    var s = Math.min(maxW / (W + RAIL * 2), maxH / (H + RAIL * 2));
    scale = s;
    var cw = (W + RAIL * 2) * s, ch = (H + RAIL * 2) * s;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cw * dpr;
    cv.height = ch * dpr;
    cv.style.width = cw + "px";
    cv.style.height = ch + "px";

    // 两侧头像与球桌保持固定距离（dist 越大 = 离球桌越远）
    var panelW = 124;
    var dist = 44;
    var freeSide = Math.max(0, (wrap.clientWidth - cw) / 2);
    var offset = freeSide - panelW - dist;
    if (offset < -panelW * 0.3) offset = -panelW * 0.3;
    var leftPanel = document.getElementById("sideMe");
    var rightPanel = document.getElementById("sideAi");
    if (leftPanel) leftPanel.style.left = offset + "px";
    if (rightPanel) rightPanel.style.right = offset + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    offX = RAIL * s;
    offY = RAIL * s;
  }

  function w2c(x, y) { return { x: offX + x * scale, y: offY + y * scale }; }

  function draw() {
    var cw = cv.width / (Math.min(window.devicePixelRatio || 1, 2));
    var ch = cv.height / (Math.min(window.devicePixelRatio || 1, 2));
    ctx.clearRect(0, 0, cw, ch);

    // 台面
    var p0 = w2c(-RAIL, -RAIL), p1 = w2c(W + RAIL, H + RAIL);
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 18;
    ctx.fillStyle = "#6b4226";
    roundRect(p0.x, p0.y, p1.x - p0.x, p1.y - p0.y, 14 * scale);
    ctx.fill();
    ctx.restore();

    var q0 = w2c(0, 0), q1 = w2c(W, H);
    ctx.fillStyle = "#0f6b3f";
    ctx.fillRect(q0.x, q0.y, q1.x - q0.x, q1.y - q0.y);

    // 袋口
    for (var i = 0; i < POCKETS.length; i++) {
      var pk = w2c(POCKETS[i].x, POCKETS[i].y);
      ctx.beginPath();
      ctx.arc(pk.x, pk.y, POCKET_R * scale * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = "#07160f";
      ctx.fill();
    }

    // 球
    for (var j = 0; j < balls.length; j++) {
      var b = balls[j];
      if (b.potted) continue;
      var c = w2c(b.x, b.y);
      ctx.beginPath();
      ctx.arc(c.x, c.y, R * scale, 0, Math.PI * 2);
      ctx.fillStyle = b.n === 0 ? "#f7f7f2" : COLORS[b.n] || "#999";
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.25)";
      ctx.lineWidth = 1;
      ctx.stroke();

      if (b.n !== 0) {
        // 号码圈
        ctx.beginPath();
        ctx.arc(c.x, c.y, R * scale * 0.52, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.fillStyle = "#222";
        ctx.font = "bold " + Math.max(8, R * scale * 0.75) + "px sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(String(b.n), c.x, c.y + 0.5);
      }
    }

    // 瞄准线
    if (aiming && aimFrom && aimTo) {
      var a = w2c(aimFrom.x, aimFrom.y);
      var bb = w2c(aimTo.x, aimTo.y);
      ctx.save();
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(255,255,255,.75)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      var dx = bb.x - a.x, dy = bb.y - a.y;
      var L = Math.sqrt(dx * dx + dy * dy) || 1;
      ctx.lineTo(a.x + dx / L * 700, a.y + dy / L * 700);
      ctx.stroke();
      ctx.restore();

      var power = clamp((L - 30) / 420, 0, 1);

      // 球杆：画在白球后侧，随力度后拉
      drawCueStick(cueBall(), power, dx / L, dy / L);

      // 力度条
      ctx.fillStyle = "rgba(0,0,0,.5)";
      ctx.fillRect(10, ch - 22, cw - 20, 12);
      ctx.fillStyle = power > 0.75 ? "#e74c3c" : (power > 0.45 ? "#ffb703" : "#4caf7d");
      ctx.fillRect(10, ch - 22, (cw - 20) * power, 12);
    }
  }

  function drawCueStick(cbWorld, power, ux, uy) {
    if (!cbWorld) return;
    var c = w2c(cbWorld.x, cbWorld.y);
    var pull = (12 + power * 58) * scale;         // 后拉距离
    var sx = c.x - ux * (R * scale + pull);
    var sy = c.y - uy * (R * scale + pull);
    var stickLen = 300 * scale;
    var ex = sx - ux * stickLen;
    var ey = sy - uy * stickLen;

    ctx.save();
    ctx.lineCap = "round";

    // 杆影
    ctx.strokeStyle = "rgba(0,0,0,.25)";
    ctx.lineWidth = 9 * scale;
    ctx.beginPath();
    ctx.moveTo(sx + 3 * scale, sy + 4 * scale);
    ctx.lineTo(ex + 3 * scale, ey + 4 * scale);
    ctx.stroke();

    // 杆身（木色渐变）
    var g = ctx.createLinearGradient(sx, sy, ex, ey);
    g.addColorStop(0, "#e8d3a9");
    g.addColorStop(0.06, "#c39a5f");
    g.addColorStop(0.55, "#a97840");
    g.addColorStop(1, "#6b4622");
    ctx.strokeStyle = g;
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    // 皮头
    ctx.strokeStyle = "#2f5fa8";
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - ux * 8 * scale, sy - uy * 8 * scale);
    ctx.stroke();

    // 前段白箍
    ctx.strokeStyle = "#f4f1e6";
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(sx - ux * 8 * scale, sy - uy * 8 * scale);
    ctx.lineTo(sx - ux * 16 * scale, sy - uy * 16 * scale);
    ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ================== 输入 ==================
  function toWorld(ev) {
    var rect = cv.getBoundingClientRect();
    var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    var cy = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
    return { x: (cx - offX) / scale, y: (cy - offY) / scale };
  }

  function canShoot() {
    return state && state.phase !== "over" && state.turn === 0 && !running && !aiThinking;
  }

  function onDown(ev) {
    ev.preventDefault();
    if (!state || state.phase === "over") return;
    var p = toWorld(ev);

    // 自由球：点台面放白球
    if (state.ballInHand && state.turn === 0) {
      var cb = cueBall();
      var nx = clamp(p.x, R + 4, W - R - 4);
      var ny = clamp(p.y, R + 4, H - R - 4);
      var ok = true;
      for (var i = 0; i < balls.length; i++) {
        var b = balls[i];
        if (b.potted || b === cb) continue;
        if (len(b.x - nx, b.y - ny) < R * 2.2) { ok = false; break; }
      }
      if (ok) {
        cb.potted = false;
        cb.x = nx; cb.y = ny; cb.vx = cb.vy = 0;
        state.ballInHand = false;
        hideMsg();
        updateHud();
      }
      return;
    }

    if (!canShoot()) return;
    var cb2 = cueBall();
    if (!cb2 || cb2.potted) return;
    aiming = true;
    aimFrom = { x: cb2.x, y: cb2.y };
    aimTo = p;
  }

  function onMove(ev) {
    if (!aiming) return;
    ev.preventDefault();
    aimTo = toWorld(ev);
  }

  function onUp(ev) {
    if (!aiming) return;
    ev.preventDefault();
    aiming = false;
    var cb = cueBall();
    if (!cb || !aimTo) return;

    var dx = aimTo.x - cb.x, dy = aimTo.y - cb.y;
    var d = len(dx, dy);
    if (d < 40) return;   // 拖太短，取消（防误触）

    var power = clamp((d - 30) / 420, 0, 1);
    var speed = 480 + power * 1140;
    cb.vx = dx / d * speed;
    cb.vy = dy / d * speed;

    state.justPotted = [];
    state.firstContact = undefined;
    running = true;
    hideMsg();
    updateHud();
  }

  cv.addEventListener("mousedown", onDown);
  cv.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  cv.addEventListener("touchstart", onDown, { passive: false });
  cv.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onUp, { passive: false });

  // ================== HUD / 消息 ==================
  var msgTimer = null;
  function showMsg(txt) {
    var el = document.getElementById("msg");
    el.textContent = txt;
    el.classList.add("show");
    if (msgTimer) clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }
  function hideMsg() {
    document.getElementById("msg").classList.remove("show");
  }

  function updateHud() {
    var hud = document.getElementById("hud");
    var meG = state.groups[0] ? (state.groups[0] === "solid" ? "全色 1-7" : "花球 9-15") : "未分组";
    var left = remainingFor(0);
    hud.innerHTML = "我方：<b>" + meG + "</b><br>剩余：" + (left === null ? "-" : left) +
      (left === 0 ? "（打 8 号）" : "") +
      "<br>回合：" + (state.turn === 0 ? "你" : "电脑");

    document.getElementById("sideMe").classList.toggle("active", state.turn === 0);
    document.getElementById("sideAi").classList.toggle("active", state.turn === 1);
    document.getElementById("turnText").textContent = state.turn === 0 ? "轮到你" : "电脑思考中…";

    var myLeft = remainingFor(0), aiLeft = remainingFor(1);
    document.getElementById("leftMe").textContent = myLeft === null ? "" : (myLeft === 0 ? "打8号" : myLeft + " 颗");
    document.getElementById("leftAi").textContent = aiLeft === null ? "" : (aiLeft === 0 ? "打8号" : aiLeft + " 颗");
  }

  document.getElementById("btnNew").addEventListener("click", function () {
    if (!confirm("重新选择选手并开一局？")) return;
    selMe = -1; selOpp = -1;
    renderPlayers();
    document.getElementById("setup").classList.remove("hide");
  });

  document.getElementById("btnHint").addEventListener("click", function () {
    if (!canShoot()) return;
    var shot = aiFindShot();
    if (!shot) { showMsg("没找到明显机会，试试轻碰"); return; }
    aimFrom = { x: cueBall().x, y: cueBall().y };
    aimTo = { x: shot.tx, y: shot.ty };
    aiming = true;
    showMsg("已显示建议方向，松手击球");
    setTimeout(function () { aiming = false; }, 2500);
  });

  window.addEventListener("resize", function () { resize(); });

  // 调试入口（不影响游戏）
  window.__b8 = {
    getState: function () { return state; },
    getBalls: function () { return balls; },
    resolveShot: resolveShot,
    newGame: newGame,
    updateHud: updateHud,
    setTurn: function (t) { state.turn = t; }
  };

  // ================== 启动 ==================
  document.getElementById("soundBtn").addEventListener("click", function (e) {
    sfxOn = !sfxOn;
    e.target.textContent = sfxOn ? "\U0001F50A" : "\U0001F507";
  });
  document.getElementById("musicBtn").addEventListener("click", function (e) {
    musicOn = !musicOn;
    e.target.style.opacity = musicOn ? "1" : ".35";
    if (musicOn) musicStart(); else musicStop();
  });
  document.addEventListener("pointerdown", function once() {
    ac();
    if (musicOn) musicStart();
    document.removeEventListener("pointerdown", once);
  });

  renderPlayers();
  document.getElementById("btnStart").addEventListener("click", function () {
    if (selMe < 0 || selOpp < 0) return;
    applyPlayers();
    document.getElementById("setup").classList.add("hide");
    newGame();
    resize();
    updateHud();
  });

  // 关掉主循环的重复启动
  if (window.__b8) { window.__b8 = window.__b8; }
  newGame();
  document.getElementById("setup").classList.remove("hide");
  resize();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
