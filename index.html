<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃了啥 · 营养查询</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #222;
  }
  header {
    background: linear-gradient(135deg, #2e7d5b, #4caf7d);
    color: #fff; padding: 18px 16px 14px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .5px; }
  header p { margin: 4px 0 0; font-size: 12px; opacity: .85; }
  header .hd { display: flex; align-items: center; gap: 11px; }
  header .av {
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(255,255,255,.75); box-shadow: 0 1px 4px rgba(0,0,0,.15);
  }
  header .hd-txt h1 { font-size: 18px; }
  header .hd-txt p { font-size: 12px; }

  .search-wrap { padding: 12px 12px 0; }
  #search {
    width: 100%; padding: 11px 14px; font-size: 15px;
    border: 1px solid #dfe3e6; border-radius: 10px; outline: none;
    background: #fff;
  }
  #search:focus { border-color: #4caf7d; box-shadow: 0 0 0 3px rgba(76,175,125,.15); }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 4px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 auto; padding: 6px 14px; border-radius: 16px;
    background: #fff; border: 1px solid #e3e6e8; font-size: 13px; color: #555;
    cursor: pointer; user-select: none;
  }
  .cat.active { background: #2e7d5b; color: #fff; border-color: #2e7d5b; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 14px; padding: 10px 12px 30px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    #plate { position: fixed; left: 0; right: 0; bottom: 0; max-height: 46vh; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.15); z-index: 20; }
    body { padding-bottom: 46vh; }
    #plate.collapsed { max-height: 56px; overflow: hidden; }
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .food {
    background: #fff; border-radius: 12px; padding: 12px; cursor: pointer;
    border: 1px solid #eceff1; transition: .15s; position: relative;
  }
  .food:hover { border-color: #4caf7d; transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,.06); }
  .food .name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .food .alias { font-size: 11px; color: #999; min-height: 14px; margin-bottom: 6px; }
  .food .kcal { font-size: 20px; font-weight: 700; color: #2e7d5b; }
  .food .kcal span { font-size: 11px; font-weight: 400; color: #888; margin-left: 2px; }
  .food .tag { position: absolute; top: 10px; right: 10px; font-size: 10px; color: #aaa; }
  .photo-card {
    background: #fff; border: 1px solid #eceff1; border-radius: 12px;
    padding: 12px; margin-bottom: 12px;
  }
  .ph-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ph-title { font-size: 14px; font-weight: 600; flex: 1; }
  .ph-btn {
    font-size: 13px; color: #2e7d5b; background: #e8f5ee;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; user-select: none;
  }
  .ph-btn:hover { background: #d6eddf; }
  .ph-empty { font-size: 13px; color: #aaa; padding: 8px 0; }
  .ph-img-wrap { position: relative; }
  .ph-img-wrap img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 10px; display: block; }
  .ph-del {
    position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.55);
    color: #fff; border: none; border-radius: 14px; padding: 4px 10px;
    font-size: 12px; cursor: pointer;
  }
  .ph-tip { font-size: 11px; color: #999; margin-top: 6px; }
  .empty { padding: 40px 10px; text-align: center; color: #999; font-size: 14px; }
  .disclaimer-bar {
    background: #fff4e0;
    border-left: 5px solid #e08b2d;
    border-bottom: 1px solid #f3dfbb;
    color: #8a5a1a;
    font-size: 13.5px;
    padding: 11px 16px;
    line-height: 1.5;
  }
  .disclaimer-bar b { color: #d9722a; margin-right: 2px; }
  .disclaimer-bar .no-commercial { color: #d92f2f; font-weight: 700; }
  #plate {
    background: #fff; border-radius: 14px; padding: 14px; height: fit-content;
    border: 1px solid #eceff1; position: sticky; top: 96px;
  }
  #plate h2 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  #plate h2 .clear { font-size: 12px; color: #999; cursor: pointer; font-weight: 400; }
  .pitem { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed #f0f0f0; font-size: 14px; }
  .pitem .pn { flex: 1; cursor: pointer; }
  .pdetail { font-size: 12px; color: #667; background: #f9fbfa; border-radius: 8px; padding: 6px 8px; margin: -2px 0 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .pdetail b { color: #2e7d5b; font-weight: 600; }
  .pitem .pk { color: #2e7d5b; font-weight: 600; font-size: 13px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid #e0e0e0;
    background: #fafafa; cursor: pointer; font-size: 14px; line-height: 1; color: #666;
  }
  .stepper span { min-width: 18px; text-align: center; font-size: 12px; }
  .pitem .del { color: #ccc; cursor: pointer; font-size: 16px; line-height: 1; }
  .total { margin-top: 10px; background: #f7faf8; border-radius: 10px; padding: 10px; }
  .total .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .total .row b { color: #2e7d5b; }
  .note { font-size: 11px; color: #999; margin-top: 8px; line-height: 1.5; }
  .detail-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .detail-mask.show { display: flex; }
  .detail {
    background: #fff; border-radius: 16px; max-width: 420px; width: 100%;
    max-height: 80vh; overflow: auto; padding: 20px;
  }
  .detail h3 { margin: 0 0 2px; font-size: 18px; }
  .detail .sub { color: #888; font-size: 12px; margin-bottom: 14px; }
  .nut { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #f2f2f2; font-size: 14px; }
  .nut b { color: #2e7d5b; }
  .dbtns { display: flex; gap: 10px; margin-top: 16px; }
  .add-btn {
    flex: 1; padding: 11px; border: none; border-radius: 10px;
    background: #2e7d5b; color: #fff; font-size: 15px; cursor: pointer;
  }
  .close {
    flex: 0 0 90px; padding: 11px; border: 1px solid #e0e0e0; border-radius: 10px;
    background: #fafafa; color: #666; font-size: 15px; cursor: pointer;
  }
  .food .plus {
    position: absolute; right: 8px; bottom: 8px;
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: #e8f5ee; color: #2e7d5b;
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .food .plus:hover { background: #2e7d5b; color: #fff; }
</style>

  ["杏仁","杏仁,巴旦木","坚果",578,21.2,49.9,21.6,12.5,264,3.7,3.1,0],
  ["瓜子","瓜子,葵花籽","坚果",606,22.6,53.4,17.3,4.8,72,5.9,6.0,0],

  ["可乐","可乐,汽水","其他",43,0,0,10.8,0,2,0.1,0.02,0],
  ["啤酒","啤酒","其他",32,0.4,0,2.4,0,6,0.4,0.2,0],
  ["沙拉酱","沙拉酱,蛋黄酱","其他",725,0.9,78.0,3.7,0,9,0.3,0.2,0],
  ["橄榄油","橄榄油,食用油","其他",899,0,99.9,0,0,0,0,0,0]
];

const FIELDS = ["热量","蛋白质","脂肪","碳水","膳食纤维","钙","铁","锌","维生素C"];
const UNITS  = ["kcal","g","g","g","g","mg","mg","mg","mg"];

let curCat = "全部";
let keyword = "";
let plate = []; // {idx, qty}
let expanded = new Set();

const $ = id => document.getElementById(id);

function cats() {
  const set = ["全部", ...new Set(FOODS.map(f => f[2]))];
  $("cats").innerHTML = set.map(c =>
    `<div class="cat ${c===curCat?'active':''}" data-c="${c}">${c}</div>`).join("");
  $("cats").querySelectorAll(".cat").forEach(el =>
    el.onclick = () => { curCat = el.dataset.c; render(); cats(); });
}

function match(f) {
  if (curCat !== "全部" && f[2] !== curCat) return false;
  if (!keyword) return true;
  const k = keyword.toLowerCase();
  return f[0].toLowerCase().includes(k) || (f[1]||"").toLowerCase().includes(k) || f[2].includes(k);
}

function render() {
  const list = FOODS.map((f,i)=>({f,i})).filter(o => match(o.f));
  $("list").innerHTML = list.length ? list.map(({f,i}) => `
    <div class="food" data-i="${i}">
      <div class="tag">${f[2]}</div>
      <div class="name">${f[0]}</div>
      <div class="alias">${f[1]||""}</div>
      <div class="kcal">${f[3]}<span>kcal / 100g</span></div>
      <button class="plus" data-add="${i}" title="加入餐盘">+</button>
    </div>`).join("") : `<div class="empty">没找到这个食物，换个词试试</div>`;
  $("list").querySelectorAll(".food").forEach(el =>
    el.onclick = () => showDetail(+el.dataset.i));
  $("list").querySelectorAll(".plus").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); addToPlate(+btn.dataset.add); });
}

function showDetail(i) {
  const f = FOODS[i];
  $("d_name").textContent = f[0];
  $("d_sub").textContent = (f[1] ? "又名：" + f[1] + " · " : "") + f[2] + " · 每 100 克可食部";
  $("d_nuts").innerHTML = FIELDS.map((n,k) =>
    `<div class="nut"><span>${n}</span><b>${f[3+k]} ${UNITS[k]}</b></div>`).join("");
  $("mask").classList.add("show");
  $("closeBtn").onclick = () => $("mask").classList.remove("show");
  $("addBtn").onclick = () => { addToPlate(i); $("mask").classList.remove("show"); };
  $("mask").onclick = e => { if (e.target === $("mask")) $("mask").classList.remove("show"); };
}

function addToPlate(i) {
  const hit = plate.find(p => p.idx === i);
  if (hit) hit.qty += 1; else plate.push({idx:i, qty:1});
  renderPlate();
}

function renderPlate() {
  const box = $("pitems");
  if (!plate.length) {
    box.innerHTML = `<div class="empty" style="padding:18px 0;font-size:13px">还没选食物</div>`;
    $("total").style.display = "none";
    return;
  }
  box.innerHTML = plate.map((p,k) => {
    const f = FOODS[p.idx];
    const q = p.qty;
    const detail = expanded.has(p.idx) ? `<div class="pdetail">
        <span>蛋白 <b>${(f[4]*q).toFixed(1)}g</b></span>
        <span>脂肪 <b>${(f[5]*q).toFixed(1)}g</b></span>
        <span>碳水 <b>${(f[6]*q).toFixed(1)}g</b></span>
        <span>纤维 <b>${(f[7]*q).toFixed(1)}g</b></span>
        <span>钙 <b>${(f[8]*q).toFixed(0)}mg</b></span>
        <span>铁 <b>${(f[9]*q).toFixed(1)}mg</b></span>
      </div>` : "";
    return `<div class="pitem">
      <span class="pn" data-x="${p.idx}" title="点名字看营养">${f[0]} <span style="color:#bbb;font-size:11px">${expanded.has(p.idx)?'▾':'▸'}</span></span>
      <span class="pk">${f[3]*q}<span style="font-weight:400;color:#888;font-size:11px"> kcal</span></span>
      <span class="stepper">
        <button data-m="${k}">−</button><span>${q}</span><button data-p="${k}">+</button>
      </span>
      <span class="del" data-d="${k}">×</span>
    </div>` + detail;
  }).join("");
  box.querySelectorAll(".pn").forEach(el => el.onclick = () => {
    const id = +el.dataset.x;
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderPlate();
  });
  box.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => { plate[+b.dataset.p].qty++; renderPlate(); });
  box.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => {
    const k = +b.dataset.m; plate[k].qty--; if (plate[k].qty <= 0) plate.splice(k,1); renderPlate();
  });
  box.querySelectorAll(".del").forEach(b => b.onclick = () => { plate.splice(+b.dataset.d,1); renderPlate(); });

  const sum = [0,0,0,0,0];
  plate.forEach(p => {
    const f = FOODS[p.idx];
    for (let k=0;k<5;k++) sum[k] += f[3+k] * p.qty;
  });
  $("t_kcal").textContent = sum[0].toFixed(0);
  $("t_pro").textContent = sum[1].toFixed(1);
  $("t_fat").textContent = sum[2].toFixed(1);
  $("t_carb").textContent = sum[3].toFixed(1);
  $("t_fiber").textContent = sum[4].toFixed(1);
  $("total").style.display = "block";
}

$("search").addEventListener("input", e => { keyword = e.target.value.trim(); render(); });
$("clearBtn").onclick = () => { plate = []; renderPlate(); };

// ---- 本餐照片（本地保存，不上传）----
const PH_KEY = "mealPhoto_v1";
const phBody = $("phBody");
const photoInput = $("photoInput");

function renderPhoto(dataUrl) {
  if (!dataUrl) {
    phBody.innerHTML = '<div class="ph-empty">还没有照片，拍一张给这餐留个记录</div>';
    return;
  }
  phBody.innerHTML = '<div class="ph-img-wrap"><img src="' + dataUrl + '" alt="本餐照片">' +
    '<button class="ph-del" id="phDel">删除</button></div>' +
    '<div class="ph-tip">照片只存在本机浏览器里，不会上传</div>';
  $("phDel").onclick = () => { try { localStorage.removeItem(PH_KEY); } catch (e) {} renderPhoto(null); };
}

photoInput.onchange = e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const max = 900;
      let w = img.width, h = img.height;
      const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = cv.toDataURL("image/jpeg", 0.82);
      try { localStorage.setItem(PH_KEY, dataUrl); } catch (err) {}
      renderPhoto(dataUrl);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  photoInput.value = "";
};

try { renderPhoto(localStorage.getItem(PH_KEY)); } catch (e) { renderPhoto(null); }

cats(); render();
</script>
